<header class="app-header">
  <span class="app-title">社会保険管理システム</span>
  @if (auth.canUse()) {
    <nav>
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">要確認</a>
      <a routerLink="/monthly" routerLinkActive="active">月次保険料一覧</a>
      <a routerLink="/salaries" routerLinkActive="active">給与</a>
      <a routerLink="/bonuses" routerLinkActive="active">賞与</a>
      <a routerLink="/revisions" routerLinkActive="active">随時改定</a>
      <a routerLink="/regular" routerLinkActive="active">定時決定</a>
      <a routerLink="/adjustments" routerLinkActive="active">差額</a>
      <a routerLink="/employees" routerLinkActive="active">従業員</a>
      @if (auth.isAdmin()) {
        <a routerLink="/settings" routerLinkActive="active">設定</a>
      }
    </nav>
    <span class="spacer"></span>
    <span class="user">{{ auth.user()?.email }}（{{ auth.isAdmin() ? '管理者' : '担当者' }}）</span>
    <button type="button" class="logout" (click)="logout()">ログアウト</button>
  }
</header>
<main>
  <router-outlet />
</main>
